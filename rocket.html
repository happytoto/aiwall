<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로켓보안 | 빠르고 강한 보안</title>
<meta name="description" content="로켓보안은 위협을 빠르게 찾고 강하게 막는 보안 서비스입니다.">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg: #f4f4f5; --surface: #ffffff; --text: #18181b; --muted: #52525b;
  --line: #e4e4e7; --accent: #c2410c; --accent-ink: #ffffff; --tint: #fff1e8;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0e; --surface: #17171a; --text: #f4f4f5; --muted: #a1a1aa;
    --line: #27272a; --accent: #f97316; --accent-ink: #1c0a02; --tint: #2a1508;
  }
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; word-break: keep-all; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* nav */
.nav { height: 68px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.02em; }
.brand i { color: var(--accent); font-size: 1.5rem; }
.nav ul { display: flex; gap: 28px; list-style: none; padding: 0; font-size: 0.95rem; color: var(--muted); }
.nav ul a:hover { color: var(--text); }

.btn { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; padding: 14px 24px; border-radius: 999px; font-weight: 700; font-size: 1rem; transition: transform .2s cubic-bezier(.16,1,.3,1), background .2s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { transform: translateY(-2px); }
.btn-ghost { border: 1px solid var(--line); color: var(--text); }
.btn-ghost:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* hero: 좌 텍스트 / 우 이미지 */
.hero { min-height: calc(100dvh - 68px); display: grid; grid-template-columns: 1.1fr 1fr; gap: 56px; align-items: center; padding: 32px 0 64px; }
.hero h1 { font-size: clamp(2.4rem, 5vw, 4.2rem); line-height: 1.12; letter-spacing: -0.035em; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { margin-top: 20px; font-size: 1.15rem; color: var(--muted); max-width: 34ch; }
.cta { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
.hero figure { aspect-ratio: 4 / 5; border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* 핵심 가치: 비대칭 bento 3칸 */
.values { padding: 96px 0; border-top: 1px solid var(--line); }
.values h2 { font-size: clamp(1.8rem, 3vw, 2.4rem); letter-spacing: -0.03em; line-height: 1.25; }
.bento { margin-top: 40px; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: auto auto; gap: 16px; }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px; }
.cell i { font-size: 1.9rem; color: var(--accent); }
.cell h3 { margin-top: 18px; font-size: 1.3rem; letter-spacing: -0.02em; }
.cell p { margin-top: 8px; color: var(--muted); max-width: 42ch; }
.cell.big { grid-row: span 2; background: var(--tint); border-color: transparent; display: flex; flex-direction: column; justify-content: space-between; }
.cell.big h3 { font-size: 1.8rem; }
.cell.photo { padding: 0; overflow: hidden; position: relative; min-height: 220px; }
.cell.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

footer { padding: 32px 0 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* 등장 모션: 첫 화면 위계를 순서대로 보여 줌 */
@media (prefers-reduced-motion: no-preference) {
  .rise { opacity: 0; transform: translateY(16px); animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
}

@media (max-width: 767px) {
  .nav ul { display: none; }
  .hero { grid-template-columns: 1fr; gap: 32px; min-height: auto; padding: 24px 0 48px; }
  .hero figure { aspect-ratio: 16 / 10; }
  .bento { grid-template-columns: 1fr; }
  .cell.big { grid-row: auto; }
  .values { padding: 64px 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="nav">
    <a class="brand" href="rocket.html"><i class="ti ti-rocket" aria-hidden="true"></i>로켓보안</a>
    <nav aria-label="주요 메뉴">
      <ul>
        <li><a href="#values">서비스</a></li>
        <li><a href="index.html">AIWALL</a></li>
      </ul>
    </nav>
    <a class="btn btn-primary" href="index.html#contact">도입 문의</a>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1 class="rise" style="--i:0">위협보다 먼저,<br><em>로켓처럼</em> 막습니다</h1>
        <p class="rise" style="--i:1">AI가 위협을 먼저 찾고 바로 차단합니다. 기업 서비스를 빠르고 단단하게 지킵니다.</p>
        <div class="cta rise" style="--i:2">
          <a class="btn btn-primary" href="index.html#contact">도입 문의 <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
          <a class="btn btn-ghost" href="#values">서비스 보기</a>
        </div>
      </div>
      <figure class="rise" style="--i:1">
        <!-- TODO: 브랜드 실사 이미지로 교체 (권장 1200x1500) -->
        <img src="https://picsum.photos/seed/rocket-security-hero/1200/1500" alt="보안 관제 환경" width="1200" height="1500" fetchpriority="high">
      </figure>
    </section>

    <section id="values" class="values">
      <h2>탐지와 차단을 한 흐름으로</h2>
      <div class="bento">
        <article class="cell big">
          <i class="ti ti-bolt" aria-hidden="true"></i>
          <div>
            <h3>빠른 탐지</h3>
            <p>AI가 이상 징후를 실시간으로 살피고, 위협을 발견하면 바로 알립니다.</p>
          </div>
        </article>
        <article class="cell">
          <i class="ti ti-shield-lock" aria-hidden="true"></i>
          <h3>강한 차단</h3>
          <p>확인된 위협은 서비스에 닿기 전에 자동으로 막습니다.</p>
        </article>
        <div class="cell photo">
          <!-- TODO: 서비스 운영 사진으로 교체 (권장 800x500) -->
          <img src="https://picsum.photos/seed/rocket-security-ops/800/500" alt="" loading="lazy">
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span>© 로켓보안</span>
    <a href="index.html">ICTIS AIWALL 서비스</a>
  </footer>
</div>
</body>
</html>
